[package]
name = "thin-stt"
version = "0.1.0"
description = "Hold a hotkey in any app, speak, release — the transcript is typed where your cursor is."
edition = "2021"
rust-version = "1.85"

[dependencies]
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.5"
arboard = "3"
ureq = "3"
dirs = "6"
transcribe-rs = { version = "0.3", features = ["onnx", "whisper-cpp", "whisper-metal"] }
llama-cpp-2 = { version = "0.1.161", features = ["metal"] }
mimalloc = "0.1"
# direct dep only to reach mi_option_set/mi_collect — same crate instance as
# mimalloc's, so options tune the allocator in use
libmimalloc-sys = { version = "0.1", features = ["extended"] }
ort = "=2.0.0-rc.12"
macos-accessibility-client = "0.0.2"
global-hotkey = "0.8"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
muda = "0.17"
cocoa = "0.26"
objc = "0.2"
block = "0.1"
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"
futures = "0.3"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
